apps:
  nginx:
    user: peertube
    command: bin/service.nginx.sh
    daemon: simple
    restart-condition: always
    restart-delay: 10s
  peertube:
    user: peertube
    command: bin/service.peertube.sh
    daemon: simple
    restart-condition: always
    restart-delay: 10s
  postgresql:
    user: peertube
    command: bin/service.postgresql.sh
    daemon: forking
    restart-condition: always
    restart-delay: 10s
  redis:
    user: peertube
    daemon: simple
    command: bin/service.redis.sh
    restart-condition: always
    restart-delay: 10s
    before: [peertube]

  npm:
    command: peertube/bin/npm

  node:
    command: peertube/bin/node

  psql:
    command: bin/psql.sh

  pgdumpall:
    command: bin/pg_dumpall.sh

  storage-change:
    command: bin/cli storage-change

  access-change:
    command: bin/cli access-change

  backup-pre-stop:
    command: bin/cli backup-pre-stop

  restore-pre-start:
    command: bin/cli restore-pre-start

  restore-post-start:
    command: bin/cli restore-post-start

description: Decentralized video platform
grade: stable
name: peertube
summary: PeerTube
